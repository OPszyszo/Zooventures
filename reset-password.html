<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Reset hasła - Zooventures</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:#0a0a14;color:white;font-family:sans-serif;text-align:center;padding:40px;">

  <h2>🔑 Ustaw nowe hasło</h2>

  <input type="password" id="newPassword" placeholder="Nowe hasło"
         style="padding:10px;margin:10px;width:200px;">

  <br>

  <button id="updateBtn" style="padding:10px 20px;">
    Zmień hasło
  </button>

  <p id="msg"></p>

<script>
const supabase = window.supabase.createClient(
  'https://wjbzishechoxiafyfypr.supabase.co',
  'TWOJ_ANON_KEY'
)

// Supabase przekazuje token w URL
async function handleSession() {
  await supabase.auth.getSession()
}
handleSession()

document.getElementById('updateBtn').addEventListener('click', async () => {
  const password = document.getElementById('newPassword').value

  const { error } = await supabase.auth.updateUser({
    password
  })

  if (error) {
    document.getElementById('msg').textContent = error.message
  } else {
    document.getElementById('msg').textContent = 'Hasło zmienione!'
  }
})
</script>

</body>
</html>
