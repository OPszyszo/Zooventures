<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Przerwa Konserwacyjna</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, cyan, #0066ff);
      overflow: hidden;
    }

    .container {
      text-align: center;
      color: white;
      padding: 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: white;
      color: #0066ff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 12px;
      transition: 0.3s ease;
    }

    .btn:hover {
      transform: scale(1.05);
      background: #e6f0ff;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Przerwa Konserwacyjna</h1>
    <p>Trwa przerwa konserwacyjna, prosimy o cierpliwość</p>

    <a href="index.html" class="btn">
      Powrót
    </a>
  </div>

</body>
</html>
